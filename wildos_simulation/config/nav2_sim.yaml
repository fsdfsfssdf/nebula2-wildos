bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /spot1/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 30.0
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.50
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 1.57
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.55
      max_vel_y: 0.0
      max_vel_theta: 0.70
      min_speed_xy: 0.0
      max_speed_xy: 0.55
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 2.5
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -2.5
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 30
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.30
      xy_goal_tolerance: 0.35
      trans_stopped_velocity: 0.10
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [
        "RotateToGoal", "Oscillation", "BaseObstacle",
        "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.10
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.10
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.10
      robot_radius: 0.40
      footprint_padding: 0.02
      transform_tolerance: 0.50
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        # Obstacles now arrive at their true odom height (down to about
        # -0.5 m), so the voxel grid has to start below the ground plane.
        origin_z: -1.00
        z_resolution: 0.125
        z_voxels: 28
        max_obstacle_height: 2.0
        mark_threshold: 0
        # points is the ground-filtered lidar cloud: real geometry, used for
        # local avoidance. Traversability is a global routing prior (like the
        # edges of the WildOS navigation graph) and is deliberately not fed to
        # the local costmap: its validity boundary produced a fake wall around
        # the robot that nothing could drive out of.
        observation_sources: points
        points:
          topic: /spot1/points_obstacles
          min_obstacle_height: -10.0
          max_obstacle_height: 2.5
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 9.0
          raytrace_min_range: 0.40
          obstacle_max_range: 7.0
          obstacle_min_range: 0.40
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 0.9 m let the planner thread the rover between the shoulder rocks and
        # the road slab; nav2 also ignores returns closer than obstacle_min_range
        # (0.65 m), so by the time a rock was that close nothing could react.
        cost_scaling_factor: 2.5
        inflation_radius: 0.90
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # 60x60 m at 0.10 m is 360k cells; A* over that with unknown cells made
      # ComputePathToPose take longer than the goal keepalive. 40x40 at 0.15 m
      # is 71k cells and still covers the whole fork scene.
      width: 40
      height: 40
      resolution: 0.15
      robot_radius: 0.40
      footprint_padding: 0.02
      transform_tolerance: 0.50
      track_unknown_space: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # Global routing only: lidar marks real geometry, trav is the
        # elevation map traversability expressed as blocked cells. The relay
        # keeps a free bubble around the robot so a bad cell under the base can
        # never make the start pose unplannable.
        observation_sources: points trav
        points:
          topic: /spot1/points_obstacles
          min_obstacle_height: -10.0
          max_obstacle_height: 2.5
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 30.0
          raytrace_min_range: 0.40
          obstacle_max_range: 25.0
          obstacle_min_range: 0.40
        trav:
          topic: /spot1/trav_obstacles
          min_obstacle_height: -10.0
          max_obstacle_height: 2.5
          # Map-derived cloud: mark only, never raytrace.
          clearing: false
          marking: true
          data_type: "PointCloud2"
          obstacle_max_range: 25.0
          obstacle_min_range: 0.0
          raytrace_max_range: 0.1
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 0.9 m let the planner thread the rover between the shoulder rocks and
        # the road slab; nav2 also ignores returns closer than obstacle_min_range
        # (0.65 m), so by the time a rock was that close nothing could react.
        cost_scaling_factor: 2.5
        inflation_radius: 0.90
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      # Frontier goals always sit in unknown space, so this has to stay true.
      # The cost is bounded by keeping the rolling window small instead.
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.80, 0.0, 1.4]
    min_velocity: [-0.20, 0.0, -1.4]
    max_accel: [2.5, 0.0, 3.0]
    max_decel: [-2.5, 0.0, -3.0]
    odom_topic: /spot1/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
